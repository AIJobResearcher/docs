openapi: 3.2.1
info:
  title: Parsing & AI Connector API
  summary: Portal registry API for the platform
  description: >-
    Read access to the Portal registry owned by Parsing&AIConnector and
    consumed by Vacancies Market.
  version: 1.0.6
servers:
  - url: https://api.aijobresearcher.com/api/v1
    name: Production
    description: Production server
paths:
  /portals:
    get:
      operationId: listPortals
      summary: List portals
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Portals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Portal'
  /portals/{id}:
    get:
      operationId: getPortal
      summary: Get a portal by id
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portal'
        '404':
          description: Portal not found
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Portal:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        base_url:
          type: string
          nullable: true
